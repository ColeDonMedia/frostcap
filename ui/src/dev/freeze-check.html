<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Frostcap freeze check</title>
    <!-- Dev-only: mimics tauri.conf.json app.security.freezePrototype before any module runs. -->
    <script>
      window.__freezeErrors = [];
      window.addEventListener("error", (e) => window.__freezeErrors.push(String(e.error && e.error.stack || e.message)));
      window.addEventListener("unhandledrejection", (e) => window.__freezeErrors.push(String(e.reason && e.reason.stack || e.reason)));
      Object.freeze(Object.prototype);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
