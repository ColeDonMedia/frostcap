# Builds the Windows release artefacts for a version tag (vX.Y.Z[-pre]) and publishes
# them as a *draft* GitHub Release, so a maintainer reviews it before it goes public.
#
# Jobs (least privilege):
#   build   contents: read             builds, tests, checksums, uploads a workflow artefact
#   deny    contents: read             cargo deny check (licenses, advisories, bans, sources)
#   attest  id-token + attestations    SLSA build-provenance attestation for the artefacts
#   publish contents: write            downloads the artefact, creates the draft release
# Only `build` runs repository code; jobs with write permissions never check it out.
#
# Artefacts:
#   Frostcap_<ver>_x64-setup.exe    NSIS installer (Tauri bundler)
#   Frostcap_<ver>_x64-portable.exe the bare frostcap.exe (UI embedded, static CRT;
#                                   needs the WebView2 Runtime already installed)
#   SHA256SUMS.txt                  sha256 of both files
#
# The binaries are NOT code-signed by this workflow. See docs/RELEASING.md.
#
# Action pins: resolved with `git ls-remote` on 2026-11-18 and verified against the
# upstream tag commits (annotated tags via the peeled ^{} commit).
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.1.0)"
        required: true

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      # Untrusted input (tag name) is passed only through env and validated strictly
      # before it is used anywhere; it is never interpolated into a script.
      - name: Validate tag
        id: tag
        shell: pwsh
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ($env:TAG -cnotmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') {
            throw "Refusing to build: '$($env:TAG)' is not a release tag (vX.Y.Z or vX.Y.Z-pre)"
          }
          "tag=$($env:TAG)" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          persist-credentials: false

      # No npm cache in release builds: every package comes fresh from the lockfile.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check version matches the tag
        id: ver
        shell: pwsh
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $ver = [string]$conf.version
          if ("v$ver" -cne $env:TAG) { throw "Tag $($env:TAG) does not match tauri.conf.json version $ver (see docs/RELEASING.md)" }
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($cargo -cne $ver) { throw "Cargo.toml workspace version $cargo != $ver" }
          "version=$ver" >> $env:GITHUB_OUTPUT

      # --ignore-scripts: no dependency install scripts run. The build does not need
      # them (esbuild, rollup and the Tauri CLI use prebuilt platform packages).
      - name: Build UI
        working-directory: ui
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Tests and license gate
        run: |
          cargo test --workspace --locked
          node scripts/gen-third-party.mjs --check

      # tauri.conf.json keeps the bundler off for everyday builds; turn NSIS on for
      # releases only, via a config overlay merged by the Tauri CLI.
      - name: Build NSIS installer
        shell: pwsh
        run: |
          $overlay = Join-Path $env:RUNNER_TEMP 'release.conf.json'
          # beforeBuildCommand is emptied: the UI was already built above with
          # --ignore-scripts, and it must not be reinstalled here.
          '{ "build": { "beforeBuildCommand": "" }, "bundle": { "active": true, "targets": ["nsis"] } }' | Set-Content -Encoding utf8 $overlay
          # Arguments after `--` go to cargo: --locked fails if Cargo.lock is out of date.
          & ui/node_modules/.bin/tauri.cmd build --ci --bundles nsis --config $overlay -- --locked
          if ($LASTEXITCODE -ne 0) { throw "tauri build failed" }

      - name: Collect artefacts and checksums
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $v = $env:VERSION
          $out = New-Item -ItemType Directory -Force out
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "NSIS installer not found" }
          Copy-Item $setup.FullName (Join-Path $out "Frostcap_${v}_x64-setup.exe")
          Copy-Item target/release/frostcap.exe (Join-Path $out "Frostcap_${v}_x64-portable.exe")
          Push-Location $out
          # LF line endings so `sha256sum --check` (publish job, Linux) accepts the file.
          $lines = Get-ChildItem *.exe | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          [IO.File]::WriteAllText((Join-Path $PWD 'SHA256SUMS.txt'), (($lines -join "`n") + "`n"))
          Get-Content SHA256SUMS.txt
          Pop-Location

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: out/*
          if-no-files-found: error
          retention-days: 7

  deny:
    # cargo-deny-action is a Docker action, so it needs a Linux runner. deny.toml
    # restricts the graph to x86_64-pc-windows-msvc, so the result is the same.
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.build.outputs.tag }}
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check licenses advisories bans sources

  attest:
    runs-on: ubuntu-latest
    needs: [build, deny]
    permissions:
      id-token: write     # OIDC token for Sigstore signing
      attestations: write # store the attestation on the repository
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.exe
            dist/SHA256SUMS.txt

  publish:
    runs-on: ubuntu-latest
    needs: [build, deny, attest]
    permissions:
      contents: write # create the draft release and upload assets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS.txt
      - name: Publish draft GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: Frostcap ${{ needs.build.outputs.version }}
          draft: true
          prerelease: ${{ contains(needs.build.outputs.tag, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/Frostcap_${{ needs.build.outputs.version }}_x64-setup.exe
            dist/Frostcap_${{ needs.build.outputs.version }}_x64-portable.exe
            dist/SHA256SUMS.txt
          body: |
            Unsigned build: Windows SmartScreen may warn on first run. Verify the
            download against SHA256SUMS.txt and, optionally, the build provenance with
            `gh attestation verify <file> --repo <owner>/<repo>`
            (see docs/RELEASING.md#verifying-a-download).
            Requires Windows 10/11 (x64) and the Microsoft Edge WebView2 Runtime.
