# Continuous integration for Frostcap.
#
# Action pins: every third-party action is pinned to a full commit SHA, with the
# tag it was resolved from in the trailing comment. They were resolved with
# `git ls-remote` on 2026-11-18 and verified against the upstream tag commits (annotated
# tags compared via the peeled ^{} commit). Dependabot keeps them current.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: short

jobs:
  ui:
    name: UI (typecheck, test, build)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - name: Unit tests (vitest, if configured)
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.devDependencies.vitest -or $pkg.dependencies.vitest) {
            npx vitest run --passWithNoTests
          } else {
            Write-Host "vitest not installed; skipping"
          }
      - run: npx vite build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 3

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: windows-latest
    needs: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml pins the version; rustup installs it on first use.
      - name: Show toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The app embeds ui/dist at compile time (tauri::generate_context!).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-dist
          path: ui/dist
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  licenses:
    name: Third-party license inventory up to date
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: ui
      - run: cargo fetch --locked
      - run: node scripts/gen-third-party.mjs --check

  deny:
    name: cargo deny (licenses, advisories, bans, sources)
    # cargo-deny-action is a Docker action, so it needs a Linux runner. deny.toml
    # restricts the graph to x86_64-pc-windows-msvc, so the result is the same.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check licenses advisories bans sources
